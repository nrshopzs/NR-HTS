<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>{{PAGE_TITLE}} | Niños Rancios</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Helvetica Neue",Arial,sans-serif;background:{{BG_COLOR}};color:#242424}
    body{min-height:100vh;overflow:hidden;position:relative;background:{{BG_COLOR}}}
    .maintenance-background{position:fixed;inset:0;z-index:0;background:{{BG_COLOR}};overflow:hidden}
    .maintenance-bg-image{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;background-position:{{BG_X}}% {{BG_Y}}%;background-image:{{BG_IMAGE_CSS}};opacity:0;transition:opacity .25s ease}
    .maintenance-bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{BG_X}}% {{BG_Y}}%;opacity:0;transition:opacity .28s ease;background:{{BG_COLOR}}}
    body[data-background="image"] .maintenance-bg-image{opacity:1}
    body[data-background="video"] .maintenance-bg-video.is-ready{opacity:1}
    body[data-background="video"].video-failed .maintenance-bg-image{opacity:1}
    .maintenance-overlay{position:absolute;inset:0;background:{{OVERLAY_COLOR}};opacity:{{OVERLAY_OPACITY}};pointer-events:none}
    .maintenance-stage{position:relative;z-index:1;width:100%;height:100vh;min-height:520px;overflow:hidden}
    .maint-element{position:absolute;transform:translate(-50%,-50%);margin:0;z-index:2}
    .maint-logo{left:{{LOGO_X}}%;top:{{LOGO_Y}}%;width:{{LOGO_WIDTH}}px;max-width:90vw;height:auto;object-fit:contain}
    .maint-icon{left:{{ICON_X}}%;top:{{ICON_Y}}%;width:{{ICON_WIDTH}}px;max-width:70vw;height:auto;object-fit:contain}
    .maint-text{white-space:pre-wrap;overflow-wrap:anywhere}
    .maint-eyebrow{left:{{EYEBROW_X}}%;top:{{EYEBROW_Y}}%;{{EYEBROW_STYLE}}}
    .maint-title{left:{{TITLE_X}}%;top:{{TITLE_Y}}%;{{TITLE_STYLE}}}
    .maint-message{left:{{MESSAGE_X}}%;top:{{MESSAGE_Y}}%;{{MESSAGE_STYLE}}}
    .maint-footer{left:{{FOOTER_X}}%;top:{{FOOTER_Y}}%;{{FOOTER_STYLE}}}
    [hidden]{display:none!important}
    @media(max-width:700px){
      .maintenance-stage{min-height:520px}
      .maint-logo{width:{{LOGO_MOBILE_WIDTH}}px}
      .maint-icon{width:{{ICON_MOBILE_WIDTH}}px}
      .maint-eyebrow{font-size:{{EYEBROW_MOBILE_SIZE}}px!important}
      .maint-title{font-size:{{TITLE_MOBILE_SIZE}}px!important}
      .maint-message{font-size:{{MESSAGE_MOBILE_SIZE}}px!important}
      .maint-footer{font-size:{{FOOTER_MOBILE_SIZE}}px!important}
    }
  </style>
</head>
<body data-background="{{BG_MODE}}">
  <div class="maintenance-background" aria-hidden="true">
    <div class="maintenance-bg-image"></div>
    <video class="maintenance-bg-video" muted autoplay loop playsinline preload="metadata" {{VIDEO_HIDDEN}} src="{{BG_VIDEO_URL}}"></video>
    <div class="maintenance-overlay"></div>
  </div>
  <main class="maintenance-stage" role="main">
    <img class="maint-element maint-logo" src="{{LOGO_URL}}" alt="Niños Rancios" {{LOGO_HIDDEN}}>
    <img class="maint-element maint-icon" src="{{ICON_URL}}" alt="" aria-hidden="true" {{ICON_HIDDEN}}>
    <p class="maint-element maint-text maint-eyebrow" {{EYEBROW_HIDDEN}}>{{EYEBROW_TEXT}}</p>
    <h1 class="maint-element maint-text maint-title" {{TITLE_HIDDEN}}>{{TITLE_TEXT}}</h1>
    <p class="maint-element maint-text maint-message" {{MESSAGE_HIDDEN}}>{{MESSAGE_TEXT}}</p>
    <p class="maint-element maint-text maint-footer" {{FOOTER_HIDDEN}}>{{FOOTER_TEXT}}</p>
  </main>
  <script>
    (()=>{
      const body=document.body;
      const video=document.querySelector('.maintenance-bg-video');
      if(!video||body.dataset.background!=='video'||video.hasAttribute('hidden'))return;
      const ready=()=>video.classList.add('is-ready');
      if(video.readyState>=2)ready();
      else video.addEventListener('loadeddata',ready,{once:true});
      video.addEventListener('error',()=>body.classList.add('video-failed'),{once:true});
      const play=video.play();if(play&&typeof play.catch==='function')play.catch(()=>body.classList.add('video-failed'));
    })();
  </script>
</body>
</html>
