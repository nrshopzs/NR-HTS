<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="account.css">
  <title>Restablecer contraseña | Niños Rancios</title>
</head>
<body>
  <div data-shell-header></div>
  <main class="account-action-page">
    <section class="account-action-card">
      <p class="account-kicker">SEGURIDAD</p>
      <h1>Restablecer contraseña</h1>
      <p>Escribe una nueva contraseña para tu cuenta.</p>
      <form id="reset-password-form" class="account-form">
        <label>Nueva contraseña<input type="password" name="password" minlength="8" maxlength="20" autocomplete="new-password" required></label>
        <label>Confirmar contraseña<input type="password" name="confirmPassword" minlength="8" maxlength="20" autocomplete="new-password" required></label>
        <small>Debe tener de 8 a 20 caracteres, combinar mayúsculas y minúsculas e incluir un número o símbolo.</small>
        <button type="submit">Guardar nueva contraseña</button>
        <p class="account-message account-action-message" id="reset-message"></p>
      </form>
      <a class="account-action-link" id="reset-finish" href="account.html" hidden>Iniciar sesión</a>
    </section>
  </main>
  <div data-shell-footer></div>
  <script src="app.js"></script>
  <script>
    mountShell('');
    const token=new URLSearchParams(location.search).get('token')||'',form=document.getElementById('reset-password-form'),message=document.getElementById('reset-message'),finish=document.getElementById('reset-finish');
    if(!token){form.querySelector('button').disabled=true;message.textContent='Este enlace no es válido o ya caducó.'}
    form.addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(form).entries());if(body.password!==body.confirmPassword){message.textContent='Las contraseñas no coinciden.';return}const button=form.querySelector('button[type="submit"]');button.disabled=true;message.textContent='Actualizando…';try{const res=await fetch('/api/account/password/reset',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:body.password})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'No fue posible cambiar la contraseña.');message.textContent=data.message||'Contraseña actualizada.';form.querySelectorAll('input').forEach(i=>i.disabled=true);button.hidden=true;finish.hidden=false}catch(err){message.textContent=err.message;button.disabled=false}});
  </script>
</body>
</html>
