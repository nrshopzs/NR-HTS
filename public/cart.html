<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Carrito | Niños Rancios</title>
</head>
<body>
  <div data-shell-header></div>

  <main class="cart-page-wrap">
    <section class="cart-grid">
      <div class="cart-main-col">
        <h1>Mi carrito</h1>
        <div class="cart-page-list" id="cart-page-items"></div>
        <div class="cart-page-empty" id="cart-page-empty" hidden>
          <p>Tu carrito está vacío.</p>
          <a href="shop-all.html" class="cart-back-shop">Ir a la tienda</a>
        </div>
        <div class="cart-page-extras">
          <button type="button" class="cart-extra-link" id="cart-promo-toggle"><img class="cart-extra-icon" src="assets/icons/cart/icono-etiqueta.svg" alt="" aria-hidden="true"><span>Ingresar código promocional</span></button>
          <div class="cart-extra-panel" id="cart-promo-panel"></div>
          <button type="button" class="cart-extra-link" id="cart-note-toggle"><img class="cart-extra-icon" src="assets/icons/cart/icono-nota.svg" alt="" aria-hidden="true"><span>Agregar una nota</span></button>
          <div class="cart-extra-panel" id="cart-note-panel"></div>
        </div>
      </div>
      <aside class="cart-summary-col" id="cart-summary"></aside>
    </section>
  </main>

  <div data-shell-benefits></div>
  <div data-shell-footer></div>

  <script src="app.js"></script>
  <script>
    mountShell('');
  </script>
</body>
</html>
