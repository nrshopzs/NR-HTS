<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Producto | Niños Rancios</title>
</head>
<body>
  <div data-shell-header></div>

  <main class="product-page-wrap">
    <div class="product-breadcrumb" id="pd-breadcrumb">Inicio / Producto</div>

    <section class="product-layout-ref">
      <div class="product-left-ref">
        <div class="product-frame-ref" id="pd-zoom-frame">
          <img id="main-product-img" alt="Producto">
          <span class="product-zoom-hint">Pasa el cursor para ampliar</span>
        </div>
        <div class="product-gallery-thumbs" id="pd-gallery-thumbs" aria-label="Galería de imágenes"></div>
        <div class="product-color-thumbs" id="pd-color-thumbs" aria-label="Muestras de color"></div>

        <div class="product-description-ref" id="pd-description">
          <p>Producto de Niños Rancios.</p>
        </div>
      </div>

      <aside class="product-right-ref">
        <h1 id="pd-name"></h1>
        <div class="detail-price-ref" id="pd-price-wrap">
          <span class="old-price" id="pd-old-price"></span>
          <span class="sale-price" id="pd-price"></span>
        </div>
        <div class="product-stock-status" id="pd-stock-status" hidden></div>

        <label class="ref-label" for="pd-color">Color *</label>
        <select id="pd-color" class="ref-select">
          <option value="">Selecciona</option>
        </select>

        <label class="ref-label" for="pd-size">Talla *</label>
        <select id="pd-size" class="ref-select">
          <option>Selecciona</option>
          <option>CH</option>
          <option>M</option>
          <option>G</option>
          <option>XG</option>
        </select>
        <button id="pd-size-guide-open" class="size-guide-link" type="button" hidden aria-haspopup="dialog">
          <img class="size-guide-link-icon" src="assets/size-guide/guia-icon.svg" alt="" aria-hidden="true">
          <span>Guía de tallas</span>
        </button>

        <div class="ref-label">Cantidad *</div>
        <div class="ref-qty" aria-label="Cantidad">
          <button type="button" id="pd-minus">−</button>
          <input id="pd-qty" type="number" min="1" value="1" inputmode="numeric">
          <button type="button" id="pd-plus">+</button>
        </div>

        <div class="product-cta-row">
          <button class="ref-add-cart" id="pd-add">Agregar al carrito</button>
          <button class="ref-fav" id="pd-fav" type="button" aria-label="Guardar en favoritos" aria-pressed="false" title="Guardar en favoritos">
            <svg class="ref-fav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 20.5 4.9 13.92A4.94 4.94 0 0 1 3.3 10.3c0-2.78 2.17-4.8 4.8-4.8 1.62 0 3.16.77 3.9 1.96.74-1.19 2.28-1.96 3.9-1.96 2.63 0 4.8 2.02 4.8 4.8 0 1.34-.58 2.6-1.6 3.62L12 20.5Z"></path>
            </svg>
          </button>
        </div>

        <button class="ref-buy-now" type="button">Comprar ahora</button>
      </aside>
    </section>
  </main>

  <div id="size-guide-modal" class="size-guide-modal" hidden aria-hidden="true">
    <div class="size-guide-backdrop" data-size-guide-close></div>
    <section class="size-guide-dialog" role="dialog" aria-modal="true" aria-labelledby="size-guide-title">
      <button class="size-guide-close" type="button" aria-label="Cerrar guía de tallas" data-size-guide-close>×</button>
      <div class="size-guide-scroll">
        <header class="size-guide-header">
          <h2 id="size-guide-title">Guía de tallas</h2>
          <p id="size-guide-subtitle"></p>
        </header>
        <div class="size-guide-measures">
          <p id="size-guide-units">Centímetros</p>
          <p id="size-guide-tolerance">Tolerancia: ±2 cm</p>
          <div class="size-guide-table-wrap">
            <table class="size-guide-table">
              <thead><tr><th>Talla</th><th>Largo</th><th>Ancho</th></tr></thead>
              <tbody id="size-guide-table-body"></tbody>
            </table>
          </div>
        </div>
        <div class="size-guide-diagram" aria-label="Cómo medir la playera">
          <img src="assets/size-guide/playera.svg" alt="Diagrama para medir ancho y largo de una playera">
        </div>
        <p class="size-guide-note" id="size-guide-note"></p>
        <button type="button" class="size-guide-okay" data-size-guide-close>De acuerdo</button>
      </div>
    </section>
  </div>

  <div data-shell-benefits></div>
  <div data-shell-footer></div>

  <script src="app.js"></script>
  <script>
    mountShell('shop');
    document.addEventListener('DOMContentLoaded', async () => {
      await syncProductsFromServer();
      await syncInventoryFromServer();
      const q = new URLSearchParams(location.search);
      const p = PRODUCTS.find(x => x.id === q.get('id')) || PRODUCTS[0];
      if(!p) return;

      document.title = p.name + ' | Niños Rancios';
      document.getElementById('pd-name').textContent = p.name;
      document.getElementById('pd-breadcrumb').textContent = 'Inicio / ' + p.name;
      const mainProductImg = document.getElementById('main-product-img');
      const galleryThumbs = document.getElementById('pd-gallery-thumbs');
      const zoomFrame = document.getElementById('pd-zoom-frame');
      mainProductImg.src = p.img;
      mainProductImg.alt = p.name;
      const currentPrice = Number(p.price || 0);
      const oldPriceEl = document.getElementById('pd-old-price');
      if (p.oldPrice) oldPriceEl.textContent = 'MX$' + Number(p.oldPrice).toFixed(2); else oldPriceEl.style.display = 'none';
      document.getElementById('pd-price').textContent = 'MX$' + currentPrice.toFixed(2);
      const description = document.getElementById('pd-description');
      const safeInline = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const descriptionBody = p.descriptionHtml || (p.description ? `<p>${safeInline(p.description)}</p>` : '');
      if (descriptionBody) description.innerHTML = `${descriptionBody}${Array.isArray(p.colors)&&p.colors.length?`<p><strong>Color:</strong> ${p.colors.map(safeInline).join(', ')}</p>`:''}${Array.isArray(p.sizes)&&p.sizes.length?`<p><strong>Tallas:</strong> ${p.sizes.map(safeInline).join(', ')}</p>`:''}`;

      const colorSelect = document.getElementById('pd-color');
      const colorThumbs = document.getElementById('pd-color-thumbs');
      const sizeSelect = document.getElementById('pd-size');
      const stockStatus = document.getElementById('pd-stock-status');
      const favoriteButton=document.getElementById('pd-fav');
      let favoriteActive=false;
      const renderFavoriteButton=active=>{
        favoriteActive=!!active;
        favoriteButton.classList.toggle('is-favorite',favoriteActive);
        favoriteButton.setAttribute('aria-pressed',favoriteActive?'true':'false');
        favoriteButton.setAttribute('aria-label',favoriteActive?'Quitar de favoritos':'Guardar en favoritos');
        favoriteButton.title=favoriteActive?'Quitar de favoritos':'Guardar en favoritos';
      };
      const favoriteRequest=async(method='GET')=>{
        const url=method==='GET'?'/api/account/favorites':`/api/account/favorites/${encodeURIComponent(p.id)}`;
        const res=await fetch(url,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},...(method==='POST'?{body:'{}'}:{})});
        const data=await res.json().catch(()=>({}));
        if(!res.ok)throw Object.assign(new Error(data.error||'No fue posible actualizar tus favoritos.'),{status:res.status});
        return data;
      };
      const loadFavoriteState=async()=>{
        try{
          const sessionRes=await fetch('/api/account/session',{cache:'no-store',credentials:'same-origin'});
          const session=await sessionRes.json().catch(()=>({}));
          if(!session.authenticated){renderFavoriteButton(false);return}
          const data=await favoriteRequest('GET');
          renderFavoriteButton((data.favoriteIds||[]).includes(p.id));
        }catch{renderFavoriteButton(false)}
      };
      favoriteButton.addEventListener('click',async()=>{
        if(favoriteButton.disabled)return;
        favoriteButton.disabled=true;
        try{
          const sessionRes=await fetch('/api/account/session',{cache:'no-store',credentials:'same-origin'});
          const session=await sessionRes.json().catch(()=>({}));
          if(!session.authenticated){
            if(typeof rememberFavoriteAfterLogin==='function')rememberFavoriteAfterLogin(p.id);
            if(typeof openCustomerAuthOverlay==='function'){
              openCustomerAuthOverlay('login');
              const message=document.getElementById('overlay-login-message');
              if(message)message.textContent='Inicia sesión para guardar este producto en tus favoritos.';
            }else location.href='account.html';
            return;
          }
          const data=await favoriteRequest(favoriteActive?'DELETE':'POST');
          renderFavoriteButton((data.favoriteIds||[]).includes(p.id));
        }catch(err){
          if(err.status===401&&typeof openCustomerAuthOverlay==='function'){
            if(typeof rememberFavoriteAfterLogin==='function')rememberFavoriteAfterLogin(p.id);
            openCustomerAuthOverlay('login');
          }else alert(err.message||'No fue posible actualizar tus favoritos.');
        }finally{favoriteButton.disabled=false}
      });
      loadFavoriteState();

      const sizeGuideOpen=document.getElementById('pd-size-guide-open');
      const sizeGuideModal=document.getElementById('size-guide-modal');
      let sizeGuideLastFocus=null;
      const closeSizeGuide=()=>{
        sizeGuideModal.hidden=true;sizeGuideModal.setAttribute('aria-hidden','true');document.body.classList.remove('size-guide-open');
        if(sizeGuideLastFocus&&typeof sizeGuideLastFocus.focus==='function')sizeGuideLastFocus.focus();
      };
      const openSizeGuide=()=>{
        sizeGuideLastFocus=document.activeElement;sizeGuideModal.hidden=false;sizeGuideModal.setAttribute('aria-hidden','false');document.body.classList.add('size-guide-open');
        sizeGuideModal.querySelector('.size-guide-close')?.focus();
      };
      document.querySelectorAll('[data-size-guide-close]').forEach(el=>el.addEventListener('click',closeSizeGuide));
      document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!sizeGuideModal.hidden)closeSizeGuide()});
      try{
        const response=await fetch('/api/size-guide',{cache:'no-store'});
        if(response.ok){
          const {guide}=await response.json();
          if(guide&&guide.enabled!==false&&Array.isArray(guide.rows)&&guide.rows.length){
            document.getElementById('size-guide-title').textContent=guide.title||'Guía de tallas';
            document.getElementById('size-guide-subtitle').textContent=guide.subtitle||'';
            document.getElementById('size-guide-units').textContent=guide.units||'Centímetros';
            document.getElementById('size-guide-tolerance').textContent=guide.tolerance||'';
            document.getElementById('size-guide-note').textContent=guide.note||'';
            document.getElementById('size-guide-table-body').innerHTML=guide.rows.map(row=>`<tr><th scope="row">${safeInline(row.size)}</th><td>${Number(row.length).toFixed(1)}</td><td>${Number(row.width).toFixed(1)}</td></tr>`).join('');
            sizeGuideOpen.hidden=false;sizeGuideOpen.addEventListener('click',openSizeGuide);
          }
        }
      }catch(err){console.warn('No fue posible cargar la guía de tallas.',err)}

      const colors = getProductColors(p);
      colorSelect.innerHTML = '<option value="">Selecciona</option>' + colors.map(c => { const sold=getColorStock(p,c.name)<=0; return `<option value="${c.name}" ${sold?'disabled':''}>${c.name}${sold?' — Agotado':''}</option>`; }).join('');
      colorSelect.value = colors.length === 1 ? colors[0].name : '';
      colorThumbs.innerHTML = renderColorSwatches(colors, colorSelect.value);

      function setMainProductImage(src){
        if(!src)return;
        mainProductImg.src=src;
        mainProductImg.style.transform='';
        mainProductImg.style.transformOrigin='50% 50%';
        zoomFrame.classList.remove('is-zooming');
        document.querySelectorAll('#pd-gallery-thumbs .product-gallery-thumb').forEach(btn=>btn.classList.toggle('selected',btn.dataset.image===src));
      }
      function renderProductGallery(preferred=''){
        const images=getProductGallery(p,colorSelect.value);
        const ordered=preferred&&images.includes(preferred)
          ? [preferred,...images.filter(image=>image!==preferred)]
          : images;
        galleryThumbs.innerHTML=ordered.map((image,index)=>`<button type="button" class="product-gallery-thumb ${index===0?'selected':''}" data-image="${safeInline(image)}" aria-label="Ver imagen ${index+1}"><img src="${safeInline(image)}" alt="${safeInline(p.name)}"></button>`).join('');
        galleryThumbs.hidden=ordered.length<=1;
        document.querySelectorAll('#pd-gallery-thumbs .product-gallery-thumb').forEach(btn=>btn.addEventListener('click',()=>setMainProductImage(btn.dataset.image)));
        setMainProductImage(ordered[0]||p.img);
      }

      if(window.matchMedia('(hover:hover) and (pointer:fine)').matches){
        let zoomPausedByClick=false;

        zoomFrame.addEventListener('mouseenter',()=>{
          if(!zoomPausedByClick)zoomFrame.classList.add('is-zooming');
        });

        zoomFrame.addEventListener('mousemove',event=>{
          if(!zoomFrame.classList.contains('is-zooming'))return;
          const rect=zoomFrame.getBoundingClientRect();
          const x=Math.max(0,Math.min(100,((event.clientX-rect.left)/rect.width)*100));
          const y=Math.max(0,Math.min(100,((event.clientY-rect.top)/rect.height)*100));
          mainProductImg.style.transformOrigin=`${x}% ${y}%`;
        });

        zoomFrame.addEventListener('click',()=>{
          if(zoomFrame.classList.contains('is-zooming')){
            zoomFrame.classList.remove('is-zooming');
            mainProductImg.style.transformOrigin='50% 50%';
            zoomPausedByClick=true;
          }else{
            zoomPausedByClick=false;
            zoomFrame.classList.add('is-zooming');
          }
        });

        zoomFrame.addEventListener('mouseleave',()=>{
          zoomFrame.classList.remove('is-zooming');
          mainProductImg.style.transformOrigin='50% 50%';
          zoomPausedByClick=false;
        });
      }

      function syncProductOptions(){
        const selected=colorSelect.value;
        document.querySelectorAll('#pd-color-thumbs .color-swatch').forEach(btn=>{btn.classList.toggle('selected',btn.dataset.color===selected);btn.classList.toggle('sold-out',getColorStock(p,btn.dataset.color)<=0)});
        renderProductGallery(getProductImage(p,selected));
        updateSizeSelectForStock(sizeSelect,p,selected);
        const soldOut=isProductSoldOut(p);
        stockStatus.hidden=!soldOut;stockStatus.textContent=soldOut?'AGOTADO':'';
        document.getElementById('pd-add').disabled=soldOut;document.getElementById('pd-add').textContent=soldOut?'Agotado':'Agregar al carrito';
        document.querySelector('.ref-buy-now').disabled=soldOut;
      }
      colorSelect.addEventListener('change',syncProductOptions);
      sizeSelect.addEventListener('change',()=>clampQtyToStock(document.getElementById('pd-qty'),p,colorSelect.value,sizeSelect.value));
      document.querySelectorAll('#pd-color-thumbs .color-swatch').forEach(btn=>btn.addEventListener('click',()=>{if(getColorStock(p,btn.dataset.color)<=0)return;colorSelect.value=btn.dataset.color;syncProductOptions()}));
      syncProductOptions();
      document.addEventListener('nr-inventory-updated',syncProductOptions);

      const qtyInput=document.getElementById('pd-qty');
      document.getElementById('pd-minus').addEventListener('click',()=>{const value=Math.max(1,parseInt(qtyInput.value,10)||1);qtyInput.value=Math.max(1,value-1)});
      document.getElementById('pd-plus').addEventListener('click',()=>{const value=Math.max(1,parseInt(qtyInput.value,10)||1);const stock=getVariantStock(p,colorSelect.value,sizeSelect.value);qtyInput.value=Number.isFinite(stock)&&stock>0?Math.min(value+1,stock):value+1});
      qtyInput.addEventListener('input',()=>{if((parseInt(qtyInput.value,10)||0)<1)qtyInput.value=1});
      document.getElementById('pd-add').addEventListener('click',()=>{const size=sizeSelect.value;if(!colorSelect.value||!size){alert('Selecciona color y talla para continuar.');return}const stock=getVariantStock(p,colorSelect.value,size);if(Number.isFinite(stock)&&stock<=0){alert('Esta variante está agotada.');return}addToCart(p.id,qtyInput.value,{color:colorSelect.value,size})});
      document.querySelector('.ref-buy-now').addEventListener('click',()=>{
        const size=sizeSelect.value;
        if(!colorSelect.value||!size){alert('Selecciona color y talla para continuar.');return}
        const stock=getVariantStock(p,colorSelect.value,size);
        if(Number.isFinite(stock)&&stock<=0){alert('Esta variante está agotada.');return}
        if(addToCart(p.id,qtyInput.value,{color:colorSelect.value,size,openDrawer:false}))window.location.href='checkout.html';
      });
    });
  </script>
</body>
</html>
